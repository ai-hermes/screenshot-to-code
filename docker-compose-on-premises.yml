version: '3.9'

services:
  backend:
    image: ${REGISTRY:-ghcr.io}/ai-hermes/screenshot-to-code-backend:latest
    pull_policy: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-7001}:${BACKEND_PORT:-7001}"
    command: poetry run uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-7001}
  
  frontend:
    image: ${REGISTRY:-ghcr.io}/ai-hermes/screenshot-to-code-frontend:latest
    pull_policy: always
    ports:
      - "5173:5173"
